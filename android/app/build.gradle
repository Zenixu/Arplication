apply plugin: 'com.android.application'

android {
    namespace "com.aruthtale.arplication"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.aruthtale.arplication"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 57
        versionName "1.9.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Kredensial signing TIDAK disimpan di repo (repo ini publik).
    // Sumber: android/local.properties (gitignored) atau environment variable.
    // Tanpa kredensial, build release tetap jalan tetapi tidak ditandatangani.
    def signingProps = new Properties()
    def signingPropsFile = rootProject.file('local.properties')
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { signingProps.load(it) }
    }
    def ksFile = System.getenv('ARPLICATION_STORE_FILE') ?: signingProps.getProperty('arplication.storeFile')
    def ksStorePassword = System.getenv('ARPLICATION_STORE_PASSWORD') ?: signingProps.getProperty('arplication.storePassword')
    def ksKeyAlias = System.getenv('ARPLICATION_KEY_ALIAS') ?: signingProps.getProperty('arplication.keyAlias')
    def ksKeyPassword = System.getenv('ARPLICATION_KEY_PASSWORD') ?: signingProps.getProperty('arplication.keyPassword')
    def canSign = ksFile && ksStorePassword && ksKeyAlias && ksKeyPassword && file(ksFile).exists()

    if (!canSign) {
        logger.lifecycle('Arplication: kredensial signing tidak ditemukan — APK release akan TIDAK ditandatangani.')
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(ksFile)
                storePassword ksStorePassword
                keyAlias ksKeyAlias
                keyPassword ksKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (canSign) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // NewPipeExtractor memakai java.time / java.util.function; minSdk 23 butuh desugaring.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // Ekstraksi audio YouTube langsung di perangkat (tanpa server yt-dlp).
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-common:1.5.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}